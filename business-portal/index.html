<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBN Business Owner Portal | Nuvea Business Network</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Tailwind CSS CDN & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/business/css/business.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f8fafc',
              100: '#f1f5f9',
              500: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
              950: '#082f49',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- TOP BUSINESS OWNER HEADER -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand & Member Info -->
      <div class="flex items-center gap-3">
        <a href="/" class="flex items-center gap-2.5 hover:opacity-90 transition">
          <div class="w-10 h-10 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center font-black text-xl shadow-md">
            N
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-black text-lg text-white tracking-tight">NBN <span class="text-amber-400">BUSINESS PORTAL</span></span>
              <span id="headerAccountTypeBadge" class="bg-amber-400/20 text-amber-300 text-[10px] font-black px-2 py-0.5 rounded border border-amber-400/30 uppercase">Option A: Networking</span>
            </div>
            <p id="headerCategoryTaluk" class="text-[11px] text-slate-400 font-medium">ஹரூர் சாப்டர் • தங்கம் & வைர நகை பிரத்யேக சீட்</p>
          </div>
        </a>
      </div>

      <!-- Quick Switch to Other Portals & Switch Member -->
      <div class="flex items-center gap-3">
        <!-- Portal Quick Links -->
        <div class="hidden lg:flex items-center gap-1.5 text-xs bg-slate-950 p-1 rounded-xl border border-slate-800">
          <a href="/" class="px-2.5 py-1 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">🌐 Website</a>
          <a href="/admin" class="px-2.5 py-1 text-slate-400 hover:text-amber-300 rounded-lg hover:bg-slate-800 transition">🛡️ Admin</a>
          <a href="/user" class="px-2.5 py-1 text-slate-400 hover:text-blue-300 rounded-lg hover:bg-slate-800 transition">👤 Customer</a>
        </div>

        <!-- Member Switcher (Test / Preview different accounts) -->
        <div class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1.5 rounded-xl border border-slate-700 text-xs">
          <span class="text-slate-400 text-[11px] hidden sm:inline">உறுப்பினர்:</span>
          <select id="memberSelector" onchange="bizApp.switchMember(this.value)" class="bg-slate-900 text-amber-300 font-bold rounded-lg px-2 py-1 focus:outline-none border border-slate-700">
            <!-- Populated dynamically -->
          </select>
        </div>

        <!-- Public Storefront Share Button -->
        <button onclick="bizApp.copyStoreLink()" class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-black rounded-xl transition shadow-xs">
          <span>🔗 என் கடை லிங்க்</span>
        </button>

        <!-- Language Switcher -->
        <button onclick="bizApp.toggleLanguage()" id="langBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-xl font-bold border border-slate-700 transition">
          தமிழ் / EN
        </button>
      </div>

    </div>

    <!-- SUB-NAVIGATION BAR (8 BUSINESS OWNER SECTIONS) -->
    <div class="bg-slate-950 border-t border-slate-800/80 px-4 sm:px-6 lg:px-8">
      <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto py-2 no-scrollbar text-xs font-bold text-slate-300">
        <button onclick="bizApp.setTab('overview')" id="nav-overview" class="biz-tab active-tab">
          📊 கண்ணோட்டம் (Overview)
        </button>
        <button onclick="bizApp.setTab('profile')" id="nav-profile" class="biz-tab">
          🏢 சுயவிவரம் & கடை (Profile)
        </button>
        <button onclick="bizApp.setTab('networking')" id="nav-networking" class="biz-tab">
          🏛️ சாப்டர் நெட்வொர்க் (Networking)
        </button>
        <button onclick="bizApp.setTab('leads')" id="nav-leads" class="biz-tab">
          🎯 லீட் மையம் & கொட்டேஷன் (Leads)
        </button>
        <button onclick="bizApp.setTab('seller')" id="nav-seller" class="biz-tab">
          🛒 விற்பனையாளர் மையம் (Seller Hub)
        </button>
        <button onclick="bizApp.setTab('forum')" id="nav-forum" class="biz-tab">
          💬 வணிகக் கலந்துரையாடல் (Forum)
        </button>
        <button onclick="bizApp.setTab('analytics')" id="nav-analytics" class="biz-tab">
          📈 அனலிட்டிக்ஸ் (Analytics)
        </button>
        <button onclick="bizApp.setTab('settings')" id="nav-settings" class="biz-tab">
          ⚙️ அமைப்புகள் (Settings)
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN BUSINESS OWNER APP CONTAINER -->
  <main class="flex-grow max-w-7xl mx-auto w-full p-4 sm:p-6 lg:p-8">
    <div id="biz-content" class="space-y-6">
      <!-- Injected dynamically by business-app.js -->
      <div class="text-center py-20 text-slate-500 font-bold">
        <div class="animate-spin w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full mx-auto mb-3"></div>
        வணிகர் போர்டல் தரவுகள் ஏற்றப்படுகின்றன...
      </div>
    </div>
  </main>

  <!-- REUSABLE BUSINESS OWNER MODAL CONTAINER -->
  <div id="biz-modal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs hidden items-center justify-center p-4">
    <div id="biz-modal-content" class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200">
      <!-- Injected modal content -->
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 text-xs py-4 border-t border-slate-800 text-center">
    NBN Business Owner Sub-Project • Nuvea Business Network • Powered by Nuvea Studio
  </footer>

  <script src="/business/js/business-app.js"></script>
</body>
</html>
